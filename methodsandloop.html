<html>
<h2>Methods and Loops</h2>
<p>Numbers from 1 to 10</p>
<p id="numbers"></p>
<p id="random"></p>
<p id="day"></p>

<script>
  
  var text = "";
  var i;
  for (i = 1; i <= 10; i++) {
    text += i + "<br>";
  }
  document.getElementById("numbers").innerHTML = text;

  
  var randomNumber = Math.floor(Math.random() * 100);
  document.getElementById("random").innerHTML = "The random number is " + randomNumber;

 
  var today = new Date().getDay();
  document.getElementById("day").innerHTML = "Today's day number is " + today + " (0 is Sunday)";
</script>
</html>
