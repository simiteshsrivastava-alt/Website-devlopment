<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My animal fact file</title>
    <style>
        body {
            background-color: rgb(0, 98, 98);
            font-family: Arial;
            align-items: center;
        }

        .my-heading {
            color: rgb(87, 0, 0);
            font-size: 20px ;
        }
        .menu-box {
            width: 260px;
            margin: 30px;
            align-self: center;
            padding: 25px;
            border: 5px solid rgb(139, 255, 255);
            background-color: antiquewhite;
        }
        .para123 {
            color: black;
        }
        .fact123 {
            color: rgb(130, 24, 24);
            font-style: italic;
        }
    </style>
</head>
<body>
    <center>
    <div class="menu-box">
        <h2 class="my-heading"> Snow Leopard</h2>
        <p class="para123">Type: Big Cat</p>
        <p class="para123">Lives In: Mountain ranges of Central Asia</p>
        <p class="para123"> Diet: Goats, Deer and Wild Sheep</p>
        <p class="fact123">Fun Fact: Can jump up to 15 meters in one jump!!</p>
    </div>
    </center>
</body>
</html>
