<html>
   <body class="py-4">
    <div class="container">
        
        <h1 class="mb-1">My Phone Contacts</h1>

        </p>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <div class="card shadow-sm mb-3" style="max-width:400px;">

                 </li>

                </div>
                </div>
                <div class="card shadow-sm mb-3" style="max-width:400px;" ></div>

                    <pre id="codeDisplay">
                        <class="bg-light p-3 rounded border mb-0>
                </div>
            </div>
           </div>

          <script>

  
          var myContact = {
         name: "Riya Sharma",

         };

         var nameEl = document.getElementById("name");
         var phoneEl = document.getElementById("phone");
         var nameEl = document.getElementById("name");
         var phoneEl = document.getElementById("phone");

          var schoolEl = document.getElementById("school");
         var cityEl = document.getElementById("city");
         var schoolEl = document.getElementById("school");
         var cityEl = document.getElementById("city");

         var codeEl = document.getElementById("codeDisplay");
        codeEl.textContent =
         'var myContact = {\n' +
         '    name:  "' + myContact.name + '",\n' +
         '    phone: "' + myContact.phone + '",\n' +
         '    school: "' + myContact["school"] + '",\n' +
          '    city:   "' + myContact["city"] + '"\n' +
         '};';

</script>
            

            
                

               

   </body>
</html>
