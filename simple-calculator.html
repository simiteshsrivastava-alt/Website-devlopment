<h1>Simple Calculator</h1>
<p>Perform all operations using JavaScript</p>
<p id="add"></p>
<p id="sub"></p>
<p id="mul"></p>
<p id="div"></p>

<script>
   num1 = 10;
   num2 = 2;

  addResult = num1 + num2;
   subResult = num1 - num2;
   mulResult = num1 * num2;
   divResult = num1 / num2;

  document.getElementById("add").innerHTML = "The added value is: " + addResult;
  document.getElementById("sub").innerHTML = "The subtracted value is: " + subResult;
  document.getElementById("mul").innerHTML = "The multiplied value is: " + mulResult;
  document.getElementById("div").innerHTML = "The divided value is: " + divResult;
