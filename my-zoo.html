<html>
    <title>My Zoo</title>
    <head>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background: aliceblue;
                text-align: center;
                padding: 30px;
            }

            h1 {
                color: brown;
            }
            #zoo {
                border: 2px solid brown;
                width: 300px;
                margin: 16px auto;
                padding: 12px;
                border-radius: 10px;
                background: white;
            }

            .zone {
                border: 1px solid brown;
                margin: 6px 0;
                padding: 8px 12px;
                border: 6px;
                text-align: left;
            }
            button {
                background: brown;
                color: white;
                padding: 10px 24px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
            }

        </style>
    </head>
    <body>
        <h1>My Zoo</h1>
        <p>Use JavaScript and the DOM to add animal in each cage!</p>

        <div id="zoo">
            <div class="zone">Zone 1: <span id="zone1"> </span></div>
            <div class="zone">Zone 2: <span id="zone2"> </span></div>
            <div class="zone">Zone 3: <span id="zone3"> </span></div>
            <div class="zone">Total Animals: <span id="total"></span>
            </div>
        </div>

        <br>

        <button onclick="openZoo()">Open The Zoo!</button>
        <p id="zoo-status"></p>

        <script>
            function openZoo() {
                document.getElementById("zone1").innerHTML = "Lion";
                document.getElementById("zone2").innerHTML = "Elephant";
                document.getElementById("zone3").innerHTML = "Polar Bear";
                document.getElementById("total").innerHTML = "3";
                document.getElementById("zoo").style.backgroundColor = "lightgreen";

                document.getElementById("zoo-status").innerHTML = document.title + " is now open!";

            }
        </script>
    </body>
</html>
